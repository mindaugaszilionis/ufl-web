{{ define "main" }}
<article class="post">
  <div class="post-header">
    <h1>{{ .Title }}</h1>
    <div class="date">{{ .Date.Format "2006-01-02" }}</div>
  </div>
  <div class="content">
    {{ .Content }}
  </div>
  {{ with .Params.embed_url }}
  <div class="poll-embed">
    <iframe src="{{ . }}" width="100%" height="900" frameborder="0" marginheight="0" marginwidth="0">Kraunama…</iframe>
  </div>
  {{ else }}
  <p class="standings-meta">(Apklausa dar ruošiama.)</p>
  {{ end }}
  {{ with .Params.results_url }}
  <p style="margin-top:1.5rem;">
    <a href="{{ . }}" target="_blank" rel="noopener" style="display:inline-block;background:var(--brand);color:#fff;font-weight:700;padding:0.6rem 1.1rem;border-radius:8px;text-decoration:none;">
      Žiūrėti rezultatus →
    </a>
  </p>
  {{ end }}
</article>
{{ end }}
