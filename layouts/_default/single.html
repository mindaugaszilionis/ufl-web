{{ define "main" }}
<article class="post">
  <div class="post-header">
    <h1>{{ .Title }}</h1>
    <div class="date">{{ .Date.Format "2006-01-02" }}</div>
  </div>
  {{ with .Params.image }}<img src="{{ . | relURL }}" alt="{{ $.Title }}">{{ end }}
  <div class="content">
    {{ .Content }}
  </div>
</article>
{{ end }}
