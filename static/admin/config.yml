backend:
  name: git-gateway
  branch: main

publish_mode: editorial_workflow

media_folder: "static/images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "posts"
    label: "Naujienos"
    folder: "content/posts"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Pavadinimas", name: "title", widget: "string" }
      - { label: "Data", name: "date", widget: "datetime" }
      - { label: "Juodraštis", name: "draft", widget: "boolean", default: true }
      - { label: "Trumpas aprašymas", name: "summary", widget: "string", required: false }
      - { label: "Pagrindinė nuotrauka", name: "image", widget: "image", required: false }
      - { label: "Turinys", name: "body", widget: "markdown" }

  - name: "pages"
    label: "Puslapiai"
    files:
      - label: "Apie mus"
        name: "about"
        file: "content/about.md"
        fields:
          - { label: "Pavadinimas", name: "title", widget: "string" }
          - { label: "Turinys", name: "body", widget: "markdown" }
